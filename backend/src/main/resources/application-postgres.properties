# Combine with vercel-demo in production: SPRING_PROFILES_ACTIVE=vercel-demo,postgres
# PostgresEnvironmentPostProcessor normalizes Neon URI/PG variables before binding.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgres
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
# Use a transaction advisory lock; session-level locks do not work through PgBouncer.
spring.flyway.postgresql.transactional-lock=true

app.persistence.seed-once=true
# No background timer that repeatedly wakes a sleeping Neon database.
app.scheduler.enabled=false
server.servlet.session.timeout=30m
