# Real Java API + compiled React, served by the same process and domain.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# Without an external datasource each Vercel instance has its own disposable demo.
spring.datasource.url=${APP_DATASOURCE_URL:jdbc:h2:mem:maison_demo;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.h2.console.enabled=false
app.demo.enabled=true
# Empty allow-list: production API is consumed only from its own origin.
app.cors.allowed-origin-patterns=
app.auth.registration-enabled=false
app.auth.email-verification-enabled=true
app.auth.email-verification-debug-token-enabled=false
# Manual runs and conditional events remain available through the actual API.
# An autoscaled HTTP instance cannot promise a continuously running scheduler.
app.scheduler.enabled=false
